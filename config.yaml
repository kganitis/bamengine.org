baseURL: "https://bamengine.org/"
languageCode: "en-US"
title: "BAM Engine"
theme: scientific-python-hugo-theme
disableKinds: ["taxonomy"]

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

params:
  description: "Agent-based macroeconomic simulation in Python"
  colorScheme: auto
  # Google Search Console: create a property for bamengine.org, choose the
  # "HTML tag" verification method, and paste the content token below.
  googleSiteVerification: ""
  images:
    - /images/og-image.png
  author:
    name: "Konstantinos Ganitis"
  search: true

  fonts:
    - name: "Lato"
      weights: [400, 900]

  navbarlogo:
    image: logo.svg
    altText: BAM Engine
    text: BAM Engine
    link: /

  hero:
    title: BAM Engine
    subtitle: "Agent-based macroeconomic simulation in Python"
    image: logo-icon.svg
    buttontext: "Get Started"
    buttonlink: "/install/"
    secondarybuttontext: "Learn"
    secondarybuttonlink: "/learn/"

  shell:
    intro:
      - title: Try BAM Engine
        text: Use the interactive shell to try BAM Engine in the browser

  navbar:
    - title: Install
      url: /install/
    - title: Learn
      url: /learn/
    - title: Documentation
      url: https://bam-engine.readthedocs.io
      is_external: true
    - title: Benchmarks
      url: /benchmarks/
    - title: News
      url: /news/
    - title: Gallery
      url: /gallery/
    - title: Community
      url: /community/
    - title: About
      url: /about/

  footer:
    logo: logo.svg
    socialmediatitle: ""
    socialmedia:
      - link: https://github.com/kganitis/bam-engine
        icon: github
    quicklinks:
      column1:
        title: "Resources"
        links:
          - text: Documentation
            link: https://bam-engine.readthedocs.io
            is_external: true
          - text: PyPI
            link: https://pypi.org/project/bamengine/
            is_external: true
          - text: GitHub
            link: https://github.com/kganitis/bam-engine
            is_external: true
          - text: Benchmarks
            link: /benchmarks/
      column2:
        title: "Project"
        links:
          - text: About
            link: /about/
          - text: Roadmap
            link: /roadmap/
          - text: Community
            link: /community/
          - text: News
            link: /news/
      column3:
        title: "More"
        links:
          - text: Citing BAM Engine
            link: /cite/
          - text: MIT License
            link: https://github.com/kganitis/bam-engine/blob/main/LICENSE
            is_external: true
