{{- $shell := .Site.Params.shell }}
{{- $intro := index $shell "intro" }}
<div class="hero-right">
    <div class="flex-column shell-title-container">
        {{- range $intro }}
            <div class="shell-title">{{ .title }}</div>
            <div class="shell-content-message">
                <p>{{ .text }}</p>
            </div>
        {{- end }}
    </div>
    <div class="numpy-shell-canvas">
        <div class="numpy-shell-container">
            <div class="shell-lesson shell-content">
                {{partial "shell-lesson.html" | print | markdownify}}
            </div>
            <!-- Interactive Shell -->
            <iframe
                class="numpy-shell"
                title="Interactive BAM Engine REPL"
                src="/try/lite/repl/?toolbar=1&kernel=python&code=import%20micropip%0Aawait%20micropip.install%28%27bamengine%27%29%0A%0Aimport%20bamengine%20as%20bam%0A%0Asim%20%3D%20bam.Simulation.init%28seed%3D42%2C%20log_level%3D%22ERROR%22%29%0Aresults%20%3D%20sim.run%28n_periods%3D100%29%0A%0Aavg_price%20%3D%20results%5B%22Economy.avg_price%22%5D%0Ainflation%20%3D%20results%5B%22Economy.inflation%22%5D%0A%0Aprint%28f%27Final%20Average%20Market%20Price%20at%20period%20%7Bsim.t%7D%3A%20%7Bavg_price%5B-1%5D%3A.2f%7D%27%29"
            >
            </iframe>
        </div>
    </div>
</div>
