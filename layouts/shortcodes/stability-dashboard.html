{{ $dataPath := "stability" }}

<link rel="stylesheet" href="{{ "css/stability.css" | absURL }}">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

<div class="stability-dashboard" id="stability-dashboard">
  <div class="stability-loading" id="loading">Loading stability data...</div>
  <div class="stability-empty" id="empty-state" style="display:none;">
    No stability benchmark data available yet.
  </div>

  <!-- Landing: Scenario Cards -->
  <div class="stability-cards" id="cards-view" style="display:none;"></div>

  <!-- Drill-Down View -->
  <div class="stability-drilldown" id="drilldown-view">
    <div class="drilldown-header">
      <button class="back-btn" onclick="showCards()">&larr; Back</button>
      <h2 id="drilldown-title"></h2>
      <select id="commit-selector" onchange="onCommitChange()"></select>
    </div>
    <div class="summary-stats" id="drilldown-summary"></div>
    <div id="metric-groups"></div>
  </div>

  <!-- Expanded Chart Modal -->
  <div class="chart-modal-overlay" id="chart-modal" onclick="closeModal(event)">
    <div class="chart-modal">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-chart"></div>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Configuration
// ---------------------------------------------------------------------------
const THRESHOLD_GREEN = 0.95;
const THRESHOLD_YELLOW = 0.90;
const DATA_BASE = '/data/stability/';

const SCENARIO_NAMES = {
  baseline: 'Baseline',
  growth_plus: 'Growth+',
  buffer_stock: 'Buffer-Stock'
};

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let manifest = null;
let cachedData = {};  // {filename: data}
let currentScenario = null;

// ---------------------------------------------------------------------------
// Color helpers
// ---------------------------------------------------------------------------
function statusClass(passRate) {
  if (passRate >= THRESHOLD_GREEN) return 'green';
  if (passRate >= THRESHOLD_YELLOW) return 'yellow';
  return 'red';
}

function statusColor(passRate) {
  if (passRate >= THRESHOLD_GREEN) return '#28a745';
  if (passRate >= THRESHOLD_YELLOW) return '#ffc107';
  return '#dc3545';
}

function isDarkMode() {
  return document.body.dataset.theme === 'dark' ||
    document.documentElement.dataset.theme === 'dark' ||
    window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function plotlyTemplate() {
  return isDarkMode() ? 'plotly_dark' : 'plotly_white';
}

function plotlyBg() {
  return 'rgba(0,0,0,0)';
}

// ---------------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------------
async function loadManifest() {
  try {
    const resp = await fetch(DATA_BASE + 'manifest.json');
    if (!resp.ok) throw new Error('No manifest found');
    manifest = await resp.json();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty-state').style.display = 'block';
    return;
  }

  if (!manifest.runs || manifest.runs.length === 0) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty-state').style.display = 'block';
    return;
  }

  document.getElementById('loading').style.display = 'none';
  renderCards();
}

async function loadResultFile(filename) {
  if (cachedData[filename]) return cachedData[filename];
  const resp = await fetch(DATA_BASE + filename);
  const data = await resp.json();
  cachedData[filename] = data;
  return data;
}

// ---------------------------------------------------------------------------
// Landing: Scenario Cards
// ---------------------------------------------------------------------------
function renderCards() {
  const container = document.getElementById('cards-view');
  container.style.display = '';
  container.innerHTML = '';

  for (const scenario of Object.keys(SCENARIO_NAMES)) {
    const card = document.createElement('div');

    // Get latest data for this scenario
    const latest = getLatestForScenario(scenario);
    if (!latest) continue;

    const status = statusClass(latest.pass_rate);
    card.className = `stability-card card-${status}`;
    card.onclick = () => showDrilldown(scenario);

    // Sparkline data (last 10 commits)
    const sparkData = getSparklineData(scenario, 10);

    card.innerHTML = `
      <h3>${SCENARIO_NAMES[scenario]}</h3>
      <div class="pass-rate status-${status}">${(latest.pass_rate * 100).toFixed(1)}%</div>
      <div class="mean-score">Mean Score: ${latest.mean_score.toFixed(3)}</div>
      <div class="sparkline" id="spark-${scenario}"></div>
    `;

    container.appendChild(card);

    // Render sparkline after DOM insertion
    if (sparkData.length > 1) {
      setTimeout(() => renderSparkline(`spark-${scenario}`, sparkData), 0);
    }
  }
}

function getLatestForScenario(scenario) {
  for (const run of manifest.runs) {
    if (run.scenarios[scenario]) {
      return run.scenarios[scenario];
    }
  }
  return null;
}

function getSparklineData(scenario, n) {
  const data = [];
  for (const run of manifest.runs) {
    if (run.scenarios[scenario]) {
      data.push({
        commit: run.commit_short,
        tag: run.tag,
        pass_rate: run.scenarios[scenario].pass_rate,
      });
      if (data.length >= n) break;
    }
  }
  return data.reverse();  // chronological
}

function renderSparkline(containerId, data) {
  const el = document.getElementById(containerId);
  if (!el) return;

  const x = data.map((_, i) => i);
  const y = data.map(d => d.pass_rate * 100);
  const colors = data.map(d => statusColor(d.pass_rate));
  const labels = data.map(d => d.tag || d.commit);

  Plotly.newPlot(el, [{
    x: x, y: y,
    type: 'scatter',
    mode: 'lines+markers',
    marker: { color: colors, size: 6 },
    line: { color: '#999', width: 1 },
    text: labels,
    hovertemplate: '%{text}: %{y:.1f}%<extra></extra>',
  }], {
    template: plotlyTemplate(),
    paper_bgcolor: plotlyBg(),
    plot_bgcolor: plotlyBg(),
    margin: { l: 0, r: 0, t: 0, b: 0 },
    xaxis: { visible: false },
    yaxis: { visible: false, range: [Math.min(...y) - 2, Math.max(...y) + 2] },
    height: 40,
    showlegend: false,
  }, {
    displayModeBar: false,
    responsive: true,
  });
}

// ---------------------------------------------------------------------------
// Drill-Down View
// ---------------------------------------------------------------------------
function showCards() {
  document.getElementById('cards-view').style.display = '';
  document.getElementById('drilldown-view').classList.remove('active');
  currentScenario = null;
}

async function showDrilldown(scenario) {
  currentScenario = scenario;
  document.getElementById('cards-view').style.display = 'none';
  document.getElementById('drilldown-view').classList.add('active');
  document.getElementById('drilldown-title').textContent = SCENARIO_NAMES[scenario];

  // Populate commit selector
  const select = document.getElementById('commit-selector');
  select.innerHTML = '';
  for (const run of manifest.runs) {
    if (run.scenarios[scenario]) {
      const opt = document.createElement('option');
      opt.value = run.scenarios[scenario].file;
      const label = run.tag || run.commit_short;
      const date = run.timestamp.split('T')[0];
      opt.textContent = `${label} (${date})`;
      select.appendChild(opt);
    }
  }

  // Load and render the latest commit's data
  await renderDrilldownData(select.value);
}

async function onCommitChange() {
  const select = document.getElementById('commit-selector');
  await renderDrilldownData(select.value);
}

async function renderDrilldownData(filename) {
  const data = await loadResultFile(filename);

  // Summary stats
  const summary = document.getElementById('drilldown-summary');
  const s = data.summary;
  const status = statusClass(s.pass_rate);
  summary.innerHTML = `
    <div class="summary-stat">
      <div class="value status-${status}">${(s.pass_rate * 100).toFixed(1)}%</div>
      <div class="label">Pass Rate</div>
    </div>
    <div class="summary-stat">
      <div class="value">${s.mean_score.toFixed(3)}</div>
      <div class="label">Mean Score</div>
    </div>
    <div class="summary-stat">
      <div class="value">${s.std_score.toFixed(3)}</div>
      <div class="label">Std Score</div>
    </div>
    <div class="summary-stat">
      <div class="value">${s.min_score.toFixed(3)} - ${s.max_score.toFixed(3)}</div>
      <div class="label">Score Range</div>
    </div>
  `;

  // Group metrics and render charts
  await renderMetricGroups(data);
}

async function renderMetricGroups(currentData) {
  const container = document.getElementById('metric-groups');
  container.innerHTML = '';

  const groupNames = currentData.group_display_names || {};
  const metrics = currentData.metrics;

  // Group metrics by their group field
  const groups = {};
  for (const [name, info] of Object.entries(metrics)) {
    const group = info.group || 'OTHER';
    if (!groups[group]) groups[group] = [];
    groups[group].push({ name, ...info });
  }

  // Collect all historical data for this scenario (for time series in charts)
  const history = await loadScenarioHistory(currentScenario);

  // Render each group
  for (const [groupKey, groupMetrics] of Object.entries(groups)) {
    const displayName = groupNames[groupKey] || groupKey;

    const groupDiv = document.createElement('div');
    groupDiv.className = 'metric-group';

    const header = document.createElement('div');
    header.className = 'metric-group-header';
    header.innerHTML = `<span class="toggle">&#9660;</span> <h3>${displayName} (${groupMetrics.length})</h3>`;
    header.onclick = () => toggleGroup(header);

    const body = document.createElement('div');
    body.className = 'metric-group-body';

    for (const metric of groupMetrics) {
      const chartDiv = document.createElement('div');
      chartDiv.className = 'metric-chart';
      chartDiv.innerHTML = `<div class="chart-title" title="${metric.name}">${metric.name}</div><div id="chart-${metric.name.replace(/[^a-zA-Z0-9]/g, '_')}"></div>`;
      chartDiv.onclick = (e) => {
        if (e.target.closest('.js-plotly-plot')) return;
        expandChart(metric.name, history);
      };
      body.appendChild(chartDiv);
    }

    groupDiv.appendChild(header);
    groupDiv.appendChild(body);
    container.appendChild(groupDiv);

    // Render small charts after DOM insertion
    for (const metric of groupMetrics) {
      const chartId = `chart-${metric.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
      setTimeout(() => renderSmallChart(chartId, metric.name, history), 0);
    }
  }
}

async function loadScenarioHistory(scenario) {
  // Load all result files for this scenario from manifest
  const history = [];
  for (const run of [...manifest.runs].reverse()) {  // chronological
    if (run.scenarios[scenario]) {
      const data = await loadResultFile(run.scenarios[scenario].file);
      history.push({
        commit: run.commit_short,
        tag: run.tag,
        timestamp: run.timestamp,
        data: data,
      });
    }
  }
  return history;
}

function renderSmallChart(containerId, metricName, history) {
  const el = document.getElementById(containerId);
  if (!el) return;

  const x = [];
  const y = [];
  const colors = [];
  const hoverTexts = [];

  for (const entry of history) {
    const m = entry.data.metrics[metricName];
    if (!m) continue;

    const label = entry.tag || entry.commit;
    x.push(label);
    y.push(m.mean_score);
    colors.push(statusColor(m.pass_rate));
    hoverTexts.push(
      `${metricName}<br>` +
      `Score: ${m.mean_score.toFixed(3)}<br>` +
      `Value: ${m.mean_value.toFixed(4)}<br>` +
      `Pass Rate: ${(m.pass_rate * 100).toFixed(1)}%<br>` +
      `Std Score: ${m.std_score.toFixed(3)}<br>` +
      `${label}`
    );
  }

  Plotly.newPlot(el, [{
    x: x, y: y,
    type: 'scatter',
    mode: 'lines+markers',
    marker: { color: colors, size: 5 },
    line: { color: '#999', width: 1 },
    text: hoverTexts,
    hovertemplate: '%{text}<extra></extra>',
  }], {
    template: plotlyTemplate(),
    paper_bgcolor: plotlyBg(),
    plot_bgcolor: plotlyBg(),
    margin: { l: 30, r: 10, t: 5, b: 20 },
    xaxis: { showticklabels: false },
    yaxis: { range: [0, 1.05], dtick: 0.25, tickfont: { size: 9 } },
    height: 120,
    showlegend: false,
  }, {
    displayModeBar: false,
    responsive: true,
  });
}

// ---------------------------------------------------------------------------
// Group toggle
// ---------------------------------------------------------------------------
function toggleGroup(header) {
  header.classList.toggle('collapsed');
  const body = header.nextElementSibling;
  body.classList.toggle('collapsed');
}

// ---------------------------------------------------------------------------
// Expanded chart modal
// ---------------------------------------------------------------------------
function expandChart(metricName, history) {
  const modal = document.getElementById('chart-modal');
  modal.classList.add('active');

  const x = [];
  const y = [];
  const colors = [];
  const hoverTexts = [];

  for (const entry of history) {
    const m = entry.data.metrics[metricName];
    if (!m) continue;

    const label = entry.tag || entry.commit;
    x.push(label);
    y.push(m.mean_score);
    colors.push(statusColor(m.pass_rate));
    hoverTexts.push(
      `<b>${metricName}</b><br>` +
      `Score: ${m.mean_score.toFixed(3)}<br>` +
      `Value: ${m.mean_value.toFixed(4)} (std: ${m.std_value.toFixed(4)})<br>` +
      `Pass Rate: ${(m.pass_rate * 100).toFixed(1)}%<br>` +
      `Std Score: ${m.std_score.toFixed(3)}<br>` +
      `Weight: ${m.weight}<br>` +
      `${label}`
    );
  }

  Plotly.newPlot('modal-chart', [{
    x: x, y: y,
    type: 'scatter',
    mode: 'lines+markers',
    marker: { color: colors, size: 8 },
    line: { color: '#999', width: 1.5 },
    text: hoverTexts,
    hovertemplate: '%{text}<extra></extra>',
  }], {
    template: plotlyTemplate(),
    paper_bgcolor: plotlyBg(),
    plot_bgcolor: plotlyBg(),
    title: { text: metricName, font: { size: 14 } },
    xaxis: { title: 'Commit', tickangle: -45 },
    yaxis: { title: 'Mean Score', range: [0, 1.05] },
    height: 450,
    margin: { l: 60, r: 20, t: 50, b: 80 },
    showlegend: false,
  }, {
    responsive: true,
  });
}

function closeModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('chart-modal').classList.remove('active');
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', loadManifest);

// Re-render on theme change (for dark mode)
const observer = new MutationObserver(() => {
  if (currentScenario) {
    // Re-render drilldown charts on theme change
    const select = document.getElementById('commit-selector');
    if (select && select.value) renderDrilldownData(select.value);
  } else if (manifest) {
    renderCards();
  }
});
observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
observer.observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
</script>
